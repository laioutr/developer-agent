# The Developer agent's shared workflow, called from a project's own repository. Treat everything here, and everything
# a run prints, as public: the repository's collaborators read the steps and the logs.
#
# No secret is stored anywhere in GitHub. The run proves itself to Laioutr's gateway with GitHub's OIDC token; it
# checks that it is this workflow at an approved version, in the run the Cockpit started, with its one-time nonce, and
# only then hands over, for this run alone: the task, a read token for this one repository, and the model access.
# Laioutr's Anthropic key never leaves the gateway. The change goes back through it, never pushed from here.
name: Developer agent
on:
  workflow_call:
    inputs:
      task_id: { required: true, type: string }
      nonce: { required: true, type: string }
permissions:
  contents: read
  id-token: write
env:
  # Fixed here, never an input or a variable: a token sent anywhere else could be replayed.
  GATEWAY: https://agent-gateway.laioutr.cloud
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Everything is installed before any key exists, so no code fetched later runs while a key is on disk.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install the agent's tools
        run: |
          set -euo pipefail
          command -v bwrap > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap > /dev/null; }
          npm i -g @anthropic-ai/claude-code@2.1.322 > /dev/null
      - name: Get this run's keys from the gateway
        env:
          TASK_ID: ${{ inputs.task_id }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TASK_ID" =~ ^[a-z0-9]{1,40}$ && "$NONCE" =~ ^[A-Za-z0-9_-]{16,128}$ ]] || { echo "Not started by Laioutr's Cockpit."; exit 1; }
          # Tokens go to curl on its standard input, never on its command line, where other processes could read them.
          oidc=$(printf 'Authorization: Bearer %s' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | curl -sf -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GATEWAY" | jq -r .value)
          echo "::add-mask::$oidc"
          printf 'Authorization: Bearer %s' "$oidc" | curl -sf -X POST "$GATEWAY/exchange" -H @- -H "content-type: application/json" \
            -d "$(jq -n --arg task "$TASK_ID" --arg nonce "$NONCE" '{taskId: $task, nonce: $nonce}')" > "$RUNNER_TEMP/run.json"
          unset oidc
          for key in repositoryToken modelToken runToken; do echo "::add-mask::$(jq -r ".$key // empty" "$RUNNER_TEMP/run.json")"; done
          {
            echo "REPOSITORY_TOKEN=$(jq -r .repositoryToken "$RUNNER_TEMP/run.json")"
            echo "RUN_TOKEN=$(jq -r .runToken "$RUNNER_TEMP/run.json")"
            echo "BASE=$(jq -r .base "$RUNNER_TEMP/run.json")"
            echo "AGENT_SHA=$(jq -r .agentSha "$RUNNER_TEMP/run.json")"
            # A second exchange in this run is refused anyway; nothing after this step gets a way to ask.
            echo "ACTIONS_ID_TOKEN_REQUEST_URL="
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN="
          } >> "$GITHUB_ENV"
          echo "Keys received for this run."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE }}
          token: ${{ env.REPOSITORY_TOKEN }}
          path: work
          fetch-depth: 1
          persist-credentials: false
      # The agent's own scripts, at the version the gateway approved: a public repository, read with this job's own token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: laioutr/developer-agent
          ref: ${{ env.AGENT_SHA }}
          path: agent
          persist-credentials: false
      # The agent works in a sandbox: a user of its own, no network, its own /proc, none of the job's files, no credential.
      # The model credential stays with a proxy outside it, as another user, which passes on only what Claude Code needs.
      # Nothing the agent wrote runs afterwards: its processes are killed, and the patch is built from this job's own git
      # directory over its files.
      - name: Run the agent
        run: |
          # GitHub runs this with bash -e: every step of the set-up stops the job on its first failure.
          set -uo pipefail
          umask 077
          run="$RUNNER_TEMP/run.json"
          sudo sysctl -qw kernel.yama.ptrace_scope=2 kernel.core_pattern='|/bin/false'
          # bubblewrap needs a user namespace; only for the agent's start, and the sandbox may make no further one.
          userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2> /dev/null || true)
          [ -n "$userns" ] && sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
          ulimit -c 0
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin agentmodel
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin agent
          box=$(sudo mktemp -d /srv/agent.XXXXXX) && sudo chmod 755 "$box"
          node_dir=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")

          # The agent's copy of the project with a git history of its own; this job keeps the original to build the patch.
          sudo mv "$GITHUB_WORKSPACE/work/.git" "$RUNNER_TEMP/work.git"
          sudo cp -a "$GITHUB_WORKSPACE/work" "$box/work" && sudo cp -a "$RUNNER_TEMP/work.git" "$box/work/.git"
          sudo chown -R agent:agent "$box/work"
          sudo install -d -o agent -g agent -m 700 "$box/out" "$box/home"
          sudo cp -a "$GITHUB_WORKSPACE/agent/agent" "$box/scripts" && sudo chown -R root:root "$box/scripts"
          sudo install -d -o agentmodel -g agent -m 2750 "$box/model"

          # The proxy gets the credential on a pipe; the keys' file is gone before the agent starts.
          proxy_config=$(jq --arg socket "$box/model/model.sock" '{
            socket: $socket, upstream: .modelBaseUrl, token: .modelToken, models, maxOutputTokens, deadline,
            maxCalls: ((.maxTurns // 80) * 5) }' "$run")
          task=$(jq '{task, rules, models, notes, allowedOnce, maxTurns}' "$run")
          rm -f "$run"
          (printf '%s' "$proxy_config" | sudo -u agentmodel "$node_dir/bin/node" "$box/scripts/proxy.mjs" &)
          unset proxy_config
          for _ in $(seq 50); do sudo test -S "$box/model/model.sock" && break; sleep 0.2; done
          sudo test -S "$box/model/model.sock" || { echo "The model proxy did not start."; exit 1; }

          etc=""
          for file in passwd group nsswitch.conf ld.so.cache localtime alternatives; do
            [ -e "/etc/$file" ] && etc="$etc --ro-bind /etc/$file /etc/$file"
          done
          # From here on every outcome is handled below, the agent's failing included, so the change is still handed over.
          set +e
          # shellcheck disable=SC2086
          printf '%s' "$task" | sudo -u agent bash -c 'ulimit -u 2048 -f 2097152; exec "$@"' sandbox bwrap \
            --unshare-all --unshare-user --disable-userns --die-with-parent --new-session \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/sbin /sbin \
            $etc --ro-bind "$node_dir" "$node_dir" --ro-bind "$box/scripts" /agent \
            --bind "$box/work" /work --bind "$box/out" /out --bind "$box/home" /home/agent --bind "$box/model" /model \
            --proc /proc --dev /dev --size 1073741824 --tmpfs /tmp \
            --clearenv --setenv PATH "$node_dir/bin:/usr/bin:/bin" --setenv HOME /home/agent \
            --setenv AGENT_OUT /out --setenv MODEL_SOCKET /model/model.sock \
            --chdir /work node /agent/run.mjs
          agent_status=$?
          sudo pkill -KILL -u agent; sudo pkill -KILL -u agentmodel
          [ -n "$userns" ] && sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns="$userns"

          # Only regular files, folders and links are taken; no repository inside the agent's tree comes along.
          sudo find "$box/work" "$box/out" -mindepth 1 ! -type f ! -type d ! -type l -exec rm -f {} +
          sudo find "$box/work" -mindepth 1 -name .git -prune -exec rm -rf {} +
          sudo chown -R --no-dereference "$(id -u):$(id -g)" "$box/work" "$box/out"
          git_safe() { GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git --git-dir="$RUNNER_TEMP/work.git" --work-tree="$box/work" \
            -c core.fsmonitor=false -c core.hooksPath=/dev/null -c core.untrackedCache=false "$@"; }
          git_safe add -A && git_safe diff --cached --binary --no-renames > "$RUNNER_TEMP/agent.patch"
          patch_status=$?
          if [ "$agent_status" -ne 0 ] && [ ! -s "$box/out/agent-events.jsonl" ]; then
            echo "The agent did not start ($agent_status)."; report_status=1
          elif [ "$patch_status" -ne 0 ]; then
            echo "The change could not be read."; report_status=1
          else
            node "$GITHUB_WORKSPACE/agent/agent/report.mjs" "$GATEWAY" "$RUNNER_TEMP/agent.patch" "$box/out"
            report_status=$?
          fi

          # Nothing of the agent's is left for a later step, the checkouts' clean-up included.
          sudo rm -rf "$box" "$GITHUB_WORKSPACE/work" "$RUNNER_TEMP/work.git" "$RUNNER_TEMP/agent.patch"
          echo "The agent ended ($agent_status)."
          exit "$report_status"
      # However the job ends — cancelled, timed out, failed — nothing of the run stays on the machine.
      - name: Clean up
        if: always()
        run: |
          sudo pkill -KILL -u agent 2> /dev/null || true
          sudo pkill -KILL -u agentmodel 2> /dev/null || true
          sudo rm -rf "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/work.git" "$RUNNER_TEMP/agent.patch" /srv/agent.* "$GITHUB_WORKSPACE/work"
